name: Windows Fast Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: AppFlowy version used in the artifact name
        required: false
        default: 0.0.0-dev

permissions:
  contents: read

concurrency:
  group: windows-fast-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.29.0'
  RUST_TOOLCHAIN: '1.85.0'
  CARGO_MAKE_VERSION: '0.37.18'
  BUILD_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-windows:
    name: Windows x86_64 cached build
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install prebuilt Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install prebuilt Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: x86_64-pc-windows-msvc
          override: true
          profile: minimal

      - name: Cache compiled Rust output
        uses: actions/cache@v4
        with:
          path: frontend/rust-lib/target
          key: windows-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('frontend/rust-lib/Cargo.lock') }}
          restore-keys: |
            windows-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: Cache Flutter build output
        uses: actions/cache@v4
        with:
          path: |
            frontend/appflowy_flutter/.dart_tool
            frontend/appflowy_flutter/build
            ~/.pub-cache
          key: windows-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('frontend/appflowy_flutter/pubspec.lock', 'frontend/appflowy_flutter/pubspec.yaml') }}
          restore-keys: |
            windows-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Install prebuilt build tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make@${{ env.CARGO_MAKE_VERSION }}, duckscript_cli

      - name: Install Windows dependencies
        shell: bash
        working-directory: frontend
        run: |
          vcpkg integrate install
          cargo make appflowy-flutter-deps-tools

      - name: Build Windows application
        shell: bash
        working-directory: frontend
        env:
          CARGO_TERM_COLOR: always
        run: |
          flutter config --enable-windows-desktop
          dart ./scripts/flutter_release_build/build_flowy.dart exclude-directives . "$BUILD_VERSION"
          cargo make --env APP_VERSION="$BUILD_VERSION" --profile production-windows-x86 appflowy
          dart ./scripts/flutter_release_build/build_flowy.dart include-directives . "$BUILD_VERSION"

      - name: Create Windows archive and checksum
        shell: pwsh
        run: |
          $product = "frontend/appflowy_flutter/product/$env:BUILD_VERSION/windows"
          if (-not (Test-Path -LiteralPath $product -PathType Container)) {
            throw "Windows build output was not found at $product"
          }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $archive = "artifacts/AppFlowy-$env:BUILD_VERSION-windows-x86_64.zip"
          Compress-Archive -Path "$product/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -Encoding ascii "artifacts/AppFlowy-$env:BUILD_VERSION-windows-x86_64.zip.sha256"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppFlowy-${{ env.BUILD_VERSION }}-windows-x86_64-fast
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
